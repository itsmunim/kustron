<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F6F4EF"/>
      <stop offset="100%" stop-color="#EBE7DC"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1A1712"/>
      <stop offset="100%" stop-color="#C7452E"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- subtle grid hint (paper blueprint) -->
  <g stroke="#D8D3C6" stroke-width="1" opacity="0.7">
    <line x1="0" y1="126" x2="1200" y2="126"/>
    <line x1="0" y1="252" x2="1200" y2="252"/>
    <line x1="0" y1="378" x2="1200" y2="378"/>
    <line x1="0" y1="504" x2="1200" y2="504"/>
    <line x1="150" y1="0" x2="150" y2="630"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="450" y1="0" x2="450" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="750" y1="0" x2="750" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
    <line x1="1050" y1="0" x2="1050" y2="630"/>
  </g>

  <!-- logo mark -->
  <rect x="92" y="80" width="84" height="84" rx="18" fill="#FFFFFF" stroke="#E0DCD0" stroke-width="2"/>
  <text x="134" y="140" text-anchor="middle" font-family="'JetBrains Mono', Menlo, monospace" font-size="46" font-weight="500" fill="#C7452E" letter-spacing="-1">k</text>

  <!-- headline (ink gradient) -->
  <text x="92" y="268" font-family="Inter, -apple-system, sans-serif" font-size="58" font-weight="700" fill="#1A1712" letter-spacing="-1">
    Local dev environment,
  </text>
  <text x="92" y="338" font-family="Inter, -apple-system, sans-serif" font-size="58" font-weight="700" fill="url(#ink)" letter-spacing="-1">
    up in minutes
  </text>

  <!-- tagline -->
  <text x="92" y="394" font-family="Inter, -apple-system, sans-serif" font-size="24" fill="#6F6A5E">
    Define your apps in one file. Kustron handles the rest:
  </text>
  <text x="92" y="426" font-family="Inter, -apple-system, sans-serif" font-size="24" fill="#6F6A5E">
    local cluster, registry, build, deploy.
  </text>

  <!-- terminal card -->
  <rect x="92" y="462" width="1016" height="66" rx="12" fill="#17150F" stroke="#3A362C" stroke-width="1.5"/>
  <circle cx="120" cy="495" r="6" fill="#FF5F57"/>
  <circle cx="146" cy="495" r="6" fill="#FEBC2E"/>
  <circle cx="172" cy="495" r="6" fill="#28C840"/>
  <text x="205" y="500" font-family="'JetBrains Mono', Menlo, monospace" font-size="23" fill="#E8E4D8">
    <tspan fill="#A8A294">$</tspan>
    <tspan dx="12" fill="#F6F4EF">curl -fsSL https://raw.githubusercontent.com/itsmunim/kustron/master/download.sh | bash</tspan>
  </text>

  <!-- footer -->
  <line x1="92" y1="572" x2="1108" y2="572" stroke="#E0DCD0" stroke-width="1.5"/>
  <text x="92" y="604" font-family="Inter, -apple-system, sans-serif" font-size="19" fill="#6F6A5E">kustron</text>
  <text x="1108" y="604" text-anchor="end" font-family="'JetBrains Mono', Menlo, monospace" font-size="19" fill="#C7452E">deterministic · idempotent</text>
</svg>