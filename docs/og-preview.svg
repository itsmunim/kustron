<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="55%" stop-color="#0c0c17"/>
      <stop offset="100%" stop-color="#131324"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.18" r="0.6">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- mono grid hint (subtle) -->
  <g stroke="#1f1f2e" stroke-width="1" opacity="0.55">
    <line x1="0" y1="126" x2="1200" y2="126"/>
    <line x1="0" y1="252" x2="1200" y2="252"/>
    <line x1="0" y1="378" x2="1200" y2="378"/>
    <line x1="0" y1="504" x2="1200" y2="504"/>
    <line x1="150" y1="0" x2="150" y2="630"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="450" y1="0" x2="450" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="750" y1="0" x2="750" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
    <line x1="1050" y1="0" x2="1050" y2="630"/>
  </g>

  <!-- logo mark -->
  <rect x="92" y="80" width="84" height="84" rx="18" fill="#0d0d14" stroke="#3f3f46" stroke-width="2"/>
  <text x="134" y="140" text-anchor="middle" font-family="'JetBrains Mono', Menlo, monospace" font-size="46" font-weight="500" fill="#818cf8" letter-spacing="-1">k</text>

  <!-- headline -->
  <text x="92" y="268" font-family="Inter, -apple-system, sans-serif" font-size="58" font-weight="700" fill="#fafafa" letter-spacing="-1">
    Local dev environment,
  </text>
  <text x="92" y="338" font-family="Inter, -apple-system, sans-serif" font-size="58" font-weight="700" fill="#fafafa" letter-spacing="-1">
    up in <tspan fill="#818cf8">minutes</tspan>
  </text>

  <!-- tagline -->
  <text x="92" y="394" font-family="Inter, -apple-system, sans-serif" font-size="24" fill="#71717a">
    From source code to a running local Kubernetes environment.
  </text>
  <text x="92" y="426" font-family="Inter, -apple-system, sans-serif" font-size="24" fill="#71717a">
    No Kubernetes knowledge required.
  </text>

  <!-- terminal card -->
  <rect x="92" y="462" width="1016" height="66" rx="12" fill="#0d0d14" stroke="#27272a" stroke-width="1.5"/>
  <circle cx="120" cy="495" r="6" fill="#f87171"/>
  <circle cx="146" cy="495" r="6" fill="#fbbf24"/>
  <circle cx="172" cy="495" r="6" fill="#34d399"/>
  <text x="205" y="500" font-family="'JetBrains Mono', Menlo, monospace" font-size="23" fill="#e4e4e7">
    <tspan fill="#a1a1aa">$</tspan>
    <tspan dx="12" fill="#fafafa">curl -fsSL https://raw.githubusercontent.com/itsmunim/kustron/master/download.sh | bash</tspan>
  </text>

  <!-- footer -->
  <line x1="92" y1="572" x2="1108" y2="572" stroke="#27272a" stroke-width="1.5"/>
  <text x="92" y="604" font-family="Inter, -apple-system, sans-serif" font-size="19" fill="#52525b">kustron</text>
  <text x="1108" y="604" text-anchor="end" font-family="'JetBrains Mono', Menlo, monospace" font-size="19" fill="#6366f1">deterministic · idempotent</text>
</svg>